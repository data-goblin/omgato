[workspace]
resolver = "3"
members = [
    "src/camlink-ctl",
    "src/keylight-ctl",
    "src/omgato-panel",
    "src/streamdeck-ctl",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/data-goblin/omgato"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rustix = { version = "1", features = ["process"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
