# Starter Stream Deck layout for Omarchy, built from its own commands.
# Applied by: streamdeck-ctl deck preset omarchy

page_order = ["omarchy", "agents", "apps", "windows"]

[[deck.pages.omarchy.buttons]]
index = 0
label = "Menu"
glyph = "󱗼"
action = "exec:omarchy-menu toggle root"

[[deck.pages.omarchy.buttons]]
index = 1
label = "Apps"
glyph = "󰀻"
action = "exec:omarchy-menu toggle apps"

[[deck.pages.omarchy.buttons]]
index = 2
label = "Capture"
glyph = "󰹑"
action = "exec:omarchy-menu toggle capture"

[[deck.pages.omarchy.buttons]]
