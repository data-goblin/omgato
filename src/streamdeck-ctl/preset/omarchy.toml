# Suggested Stream Deck pages for Omarchy, mirroring its own bindings.
# Applied by: streamdeck-ctl deck preset omarchy

page_order = ["main", "windows", "media", "elgato"]

[[deck.pages.main.buttons]]
index = 0
label = "Terminal"
glyph = ""
action = "exec:omarchy-launch-terminal"

