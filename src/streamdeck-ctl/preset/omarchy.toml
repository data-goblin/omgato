label = "Prev ws"
glyph = "󰅁"
action = 'exec:hyprctl dispatch hl.dsp.focus({ workspace = "e-1" })'

[[deck.pages.windows.buttons]]
index = 13
label = "Next ws"
glyph = "󰅂"
action = 'exec:hyprctl dispatch hl.dsp.focus({ workspace = "e+1" })'
