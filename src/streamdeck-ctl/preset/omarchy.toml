[[deck.pages.windows.buttons]]
index = 0
label = "Close"
glyph = "󰅖"
action = "exec:hyprctl dispatch hl.dsp.window.close({})"

[[deck.pages.windows.buttons]]
index = 1
label = "Full"
glyph = "󰊓"
action = 'exec:hyprctl dispatch hl.dsp.window.fullscreen({ mode = "fullscreen" })'

[[deck.pages.windows.buttons]]
index = 2
label = "Float"
glyph = "󱂬"
action = 'exec:hyprctl dispatch hl.dsp.window.float({ action = "toggle" })'

[[deck.pages.windows.buttons]]
index = 3
label = "Gaps"
glyph = "󰡎"
action = "exec:omarchy-hyprland-window-gaps-toggle"

[[deck.pages.windows.buttons]]
