[package]
name = "streamdeck-ctl"
description = "Control Stream Deck and Stream Deck Pedal devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "streamdeck-ctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ab_glyph = "0.2"
crossterm = "0.28"
elgato-streamdeck = "0.12"
evdev = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.26"
ratatui = "0.29"
signal-hook = "0.3"
