[package]
name = "prompter-ctl"
description = "Mirror a Hyprland headless output onto an Elgato Prompter through evdi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ab_glyph = "0.2"
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["event", "mm"] }
drm = "0.15"
signal-hook = "0.3"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
